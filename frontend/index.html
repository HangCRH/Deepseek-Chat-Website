<!DOCTYPE html>
<html lang="zh">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>deepseek对话网页版——航的网站</title>
    <link rel="stylesheet" href="style.css">
    <script type="module" src="zero-md.js?register"></script>
    <script src="main.js"></script>
    <script src="request.js"></script>
</head>

<body>
    <header>
        <span onclick="outMenu()">deepseek对话</span>
        <img id="menuIcon" src="pic/menu.svg" alt="菜单">
        <div id="menuDropdown">
            <a href="javascript:void(0)" onclick="outMenu()">关于 / 版本信息</a>
            <a href="mailto:1317806770@qq.com">联系开发者</a>
        </div>
    </header>
    <main>
        <h1>欢迎使用deepseek对话网页版</h1>
        <p>这是deepseek对话的前端页面，您可以在这里与deepseek进行交互。</p>
    </main>
    <footer>
        <div id="inputArea">
            <textarea id="userInput" placeholder="请输入您的问题..."></textarea>
            <select id="modelSelect" title="在这里选择使用的模型" onchange="changeModel()">
                <option value="waiting">加载中</option>
            </select>
            <button onclick="sendRequest()" id="sendbtn">发送</button>&nbsp;
            <button onclick="setNewChat()" id="clearbtn">开启新对话</button>
        </div>
        copyright &copy; <span id="copyrightDate">2025</span> 航crh. All rights reserved.<br>
        内容由AI生成，请注意甄别。
    </footer>
    <script>
        // 获取当前年份
        const currentYear = new Date().getFullYear();
        // 设置版权年份
        document.getElementById('copyrightDate').textContent = currentYear;
    </script>
</body>

</html>
